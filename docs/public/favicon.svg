<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Snappy Cyan/Blue Gradient -->
    <linearGradient id="snappy-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Zig Amber/Orange Gradient -->
    <linearGradient id="zig-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>

    <!-- Glow/Shadow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0284c7" flood-opacity="0.4"/>
    </filter>
    <filter id="zig-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#f97316" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Squircle Canvas -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Stylized Snappy S (High-speed compression path) -->
  <path d="M 45 18 L 23 18 C 17 18 14 21.5 14 26 C 14 30.5 17.5 33 23 34 L 39 37 C 45 38.5 48 41.5 48 46.5 C 48 51 44.5 54 38 54 L 16 54" 
        fill="none" 
        stroke="url(#snappy-grad)" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- High-speed Zig lightning snap accent -->
  <path d="M 36 12 L 23 32 L 32 32 L 25 50 L 43 27 L 33 27 Z" 
        fill="url(#zig-grad)" 
        filter="url(#zig-glow)"/>
</svg>